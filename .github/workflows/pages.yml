name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh Go tip measurements, Refresh stable Go releases]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate committed report
        run: |
          git ls-files --error-unmatch go-tool-sizes.json
          node -e "const report = require('./go-tool-sizes.json'); if (report.schema_version !== 1 || !Array.isArray(report.releases) || report.releases.length === 0) process.exit(1)"
      - name: Stage static site
        run: |
          mkdir _site
          cp -R dashboard/. _site/
          cp go-tool-sizes.json _site/go-tool-sizes.json
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4